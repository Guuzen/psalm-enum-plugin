name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  psalm:
    name: PHP ${{ matrix.php }}, Psalm ${{ matrix.psalm }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        psalm: ['6', '7']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer update --no-interaction --no-progress --with-all-dependencies \
            --with "vimeo/psalm:^${{ matrix.psalm }}"

      - name: Show Psalm version
        run: vendor/bin/psalm --version

      - name: Run tests
        run: vendor/bin/psalm --no-cache --output-format=github
